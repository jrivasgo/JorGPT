[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jorgpt"
version = "0.1.0"
description = "Small Spanish language model built and trained from scratch with PyTorch."
readme = "README.md"
requires-python = ">=3.11"

dependencies = ["torch","numpy","PyYAML",]

[project.optional-dependencies]
dev = ["pytest",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
